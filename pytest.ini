[pytest]
pythonpath = .
testpaths = tests/e2e
addopts = --alluredir=./allure-results --tracing=retain-on-failure --screenshot=on
markers =
    scenario: mark test as a bdd scenario
    lighthouse: marks tests as lighthouse-related for performance auditing
log_cli = true
log_cli_level = INFO
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
